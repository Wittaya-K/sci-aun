services:

  # ── PHP-FPM (Laravel) ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aun-app
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - aun-vendor:/var/www/html/vendor
      - aun-storage:/var/www/html/storage/app
      - aun-build:/var/www/html/public/build
    environment:
      - APP_ENV=${APP_ENV:-production}
    networks:
      - aun-network
    depends_on:
      db:
        condition: service_healthy

  # ── Nginx ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: aun-nginx
    restart: always
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - aun-vendor:/var/www/html/vendor
      - aun-storage:/var/www/html/storage/app
      - aun-build:/var/www/html/public/build
    networks:
      - aun-network
    depends_on:
      - app

  # ── MySQL ────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: aun-db
    restart: always
    environment:
      MYSQL_DATABASE: sci_aun
      MYSQL_USER: sci_aun
      MYSQL_PASSWORD: uQPFVu(Oyfa3a[H5
      MYSQL_ROOT_PASSWORD: uQPFVu(Oyfa3a[H5
    volumes:
      - aun-db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3309:3306"
    networks:
      - aun-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  aun-network:
    driver: bridge

volumes:
  aun-db-data:
    driver: local
  aun-vendor:
    driver: local
  aun-storage:
    driver: local
  aun-build:
    driver: local
